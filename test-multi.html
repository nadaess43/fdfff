<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест: выбери ВСЕ верные — Картография и геоинформатика</title>
<style>
body{font-family:Arial;max-width:900px;margin:0 auto;padding:12px;background:#f4f6f8;color:#222}
#top{position:sticky;top:0;background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:10}
#bar{height:10px;background:#ddd;border-radius:5px;overflow:hidden}#bar div{height:100%;width:0;background:#2e7d32}
.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.15)}
label{display:block;padding:6px;border:1px solid #bbb;border-radius:8px;margin:4px 0;cursor:pointer}
label.ok{background:#d7f0d8;border-color:#2e7d32}
label.bad{background:#ffd9d9;border-color:#c00}
label.miss{border:2px dashed #e6a800}
button{background:#2e7d32;color:#fff;border:0;border-radius:8px;padding:8px 14px;margin:4px 4px 4px 0;cursor:pointer}
button.ghost{background:#fff;color:#2e7d32;border:1px solid #2e7d32}
.exp{display:none;background:#e8f5e9;border-radius:8px;padding:8px;margin-top:6px}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<div id="top">
<b>Тест: выбери ВСЕ верные варианты</b>
<div class="small">В каждом вопросе 2–3 правильных. Отмечай все, жми «Проверить». Зелёный — верно, красный — лишнее, пунктир — пропустил.</div>
<div id="bar"><div></div></div>
<div>Счёт: <span id="score">0</span> | Проверено: <span id="done">0/30</span> | <span id="timer">00:00</span>
<button class="ghost" onclick="shuffle()">Перемешать</button>
<button class="ghost" onclick="retryWrong()">Только ошибки</button>
<button class="ghost" onclick="resetAll()">Сброс</button></div>
</div>
<div id="box"></div>
<div class="card"><button onclick="checkAll()">Проверить всё сразу</button><div id="final"></div></div>
<script>
const Q=[
{q:"Какие пункты — из 6 значений карты по Баранскому? (3 верных)",o:["карта — альфа и омега географии","карта — второй язык географии","карта показывает цвет машин","карта — стимул заполнять белые пятна","карта сделана в Photoshop"],c:[0,1,3],e:"Баранский: альфа и омега, белые пятна, закономерности, посредник, второй язык, критерий. Photoshop тут ни при чём."},
{q:"Кто развивал картметод в XIX — нач. XX? (3 верных)",o:["Тилло","Семенов-Тян-Шанский","Тьюки","Анучин","Бертен"],c:[0,1,3],e:"Тилло, Семенов-Тян-Шанский, Анучин, Шокальский. Тьюки и Бертен — про визуализацию, позже."},
{q:"Что сделали Вегенер и Кристаллер/Лёш? (2 верных)",o:["дрейф материков по карте","теорию центральных мест через картометрию","придумали Excel","нарисовали схему метро"],c:[0,1],e:"Вегенер — плиты/дрейф. Кристаллер и Лёш — центральные места."},
{q:"Этапы исследования (выбери все 4 по порядку — отметь верные этапы)",o:["подготовительный","аналитический","обобщающий","прогнозный","удаление"],c:[0,1,2,3],e:"Всегда: подготовил → анализ → обобщение → прогноз."},
{q:"Приёмы Салищева: какие про измерение и построение? (3 верных)",o:["картометрия — расстояния и площади","графический — профили","смена проекции — лучше показать","менталка — ветки"],c:[0,1,2],e:"Менталка — не приём Салищева, это Бьюзен."},
{q:"Какие приёмы — про обработку? (2 верных)",o:["статистический — связи явлений","математический — сгладить в ряды","визуальный — посмотреть","бранч — ветка"],c:[0,1],e:"Статистика — связи, математика — ряды. Бранч — из менталок."},
{q:"Свойства про смысл и отбор (3 верных)",o:["абстрактность — смысл, а не фото","избирательность — нужное для темы","генерализация — не всё, а главное","метричность — мерить"],c:[0,1,2],e:"Метричность — про измерение, тоже верно, но тут вопрос про смысл/отбор."},
{q:"Свойства про измерение и точность (3 верных)",o:["метричность — можно мерить","однозначность — 1 знак = 1 смысл","географическое соответствие — на своём месте","наглядность — красиво"],c:[0,1,2],e:"Наглядность — про понятность глазам, а не точность."},
{q:"Что покажет ТОЛЬКО карта, а не снимок? (3 верных)",o:["магнитные аномалии","рождаемость","рельеф дна океана","цвет крыши дома"],c:[0,1,2],e:"Невидимое и абстракции — только карта. Крыши видно и на фото."},
{q:"Анаморфоза — что верно? (3 верных)",o:["масштаб плавает от цифры","размер = населению","пример — Тикунов, 2050","есть проекция и точный масштаб"],c:[0,1,2],e:"Проекции/масштаба точного нет — в этом суть."},
{q:"Картоид — что верно? (3 верных)",o:["упрощён, как схема метро","без проекции и масштаба","пример — Киев-Новгород, Австралия","показывает точные расстояния"],c:[0,1,2],e:"Точные расстояния — нет, он грубый."},
{q:"Правила менталки Бьюзена (3 верных)",o:["1 ветка = 1 слово","лист горизонтально","картинка в центре","писать абзацами мелко"],c:[0,1,2],e:"Абзацы — нет, только слова. Плюс: длина=слову, цвета, мельче от центра."},
{q:"Реки Африки для менталки (выбери верные из списка, 3 верных)",o:["Нил","Нигер","Конго","Волга","Обь"],c:[0,1,2],e:"Ещё Замбези, Лимпопо, Оранжевая. Волга/Обь — не Африка."},
{q:"ГИС — что верно? (3 верных)",o:["получить, хранить, выдать геоданные","виды: кадастр, карты, управление","пример глобальной — GRID ООН","это редактор фото"],c:[0,1,2],e:"Редактор фото — нет."},
{q:"Про э-карты и даты (2 верных)",o:["СНГ — первая половина 90-х","конгресс 1996 — главная дорога","перфокарты — 2000-е"],c:[0,1],e:"Перфокарты — самые первые ЭВМ, намного раньше."},
{q:"ГБД и Excel (3 верных)",o:["ГБД — таблица География в компе","Excel — книга из листов","поля: страна, столица, население, площадь","Excel — только для игр"],c:[0,1,2],e:"Игры — нет. Плюс экономика/правление в заданиях."},
{q:"История визуализации (3 верных)",o:["к середине XIX — столбики, круги, гистограммы","Тьюки — разведочный анализ","Бертен — язык графики","ГИС придумали в XIX"],c:[0,1,2],e:"ГИС — позже, с компьютерами."},
{q:"Две работы картинок (2 верных)",o:["показать готовое (доклад)","найти новое (закономерность)","только украшать"],c:[0,1],e:"Украшение — не работа."},
{q:"Картограмма (3 верных)",o:["заливка по цифре, интервалы","фоновая — относительное (опустынивание)","точечная — точки с цифрой (уголь)","показывает точный адрес завода"],c:[0,1,2],e:"Адрес завода — нет, это ограничение картодиаграммы тем более."},
{q:"Шкала урожайности из книги (выбери все 3 верных интервала)",o:["до 20","20-30","выше 30 ц/га","100-200"],c:[0,1,2],e:"Именно такая шкала в Рис.29."},
{q:"Картодиаграмма (3 верных)",o:["кружки размером = сумме (люди, ВВП)","где завод — не узнать, только район","в легенде все размеры + единица","показывает адрес цеха"],c:[0,1,2],e:"Адрес — нет."},
{q:"Изолинии и графики (3 верных)",o:["isol = равный","линии равных значений","графики: точки, линии, плоскости, фигуры","бранч = изолиния"],c:[0,1,2],e:"Бранч — ветка менталки."},
{q:"Техника построения (3 верных шага)",o:["изучить цифры и размещение","не закрывать столицы и границы","легенда со всеми размерами + единица","залить всё одним цветом"],c:[0,1,2],e:"Одним цветом — нет, нужна шкала."},
{q:"Тематическая vs обычная (2 верных)",o:["обычная — где что","тематическая — одна тема + цифры","тематическая — всё подряд"],c:[0,1],e:"Всё подряд — нет, одна тема."},
{q:"Чем показывать данные (3 верных)",o:["размер","цвет","форма","вкус"],c:[0,1,2],e:"Размер, цвет, форма. Религию залить нельзя — не измерить."},
{q:"Растровые редакторы (3 верных)",o:["Photoshop (платный)","GIMP (бесплатный)","Paint.NET (учебный)","Inkscape"],c:[0,1,2],e:"Inkscape — векторный."},
{q:"Векторные (2 верных)",o:["Inkscape бесплатный","Illustrator / CorelDraw платные","Photoshop"],c:[0,1],e:"Photoshop — растр."},
{q:"Примитивы вектора (выбери 3 верных)",o:["эллипс","прямоугольник","ромб","пиксель"],c:[0,1,2],e:"Пиксель — растр. Ещё квадрат, линия."},
{q:"Подписи на карте (3 верных правила)",o:["вода — голубым курсивом","площади — прописными по центру","минимум 6-7 бумага / 9-10 экран","всё вверх ногами"],c:[0,1,2],e:"Вверх ногами — запрещено. Разница уровней минимум 2 кегля."},
{q:"3 способа школьной карты (3 верных)",o:["руками в Paint на контур","конструктор с диска","ГИС / ШГИС с базой","только купить атлас"],c:[0,1,2],e:"Атлас — источник, а не способ создания."},
];
let order=[...Q.keys()],checked=new Set(),score=0;
function render(){
let h="";
order.forEach((qi,k)=>{
let q=Q[qi];
h+=`<div class="card" id="c${k}"><b>${k+1}. ${q.q}</b>`+q.o.map((o,oi)=>`<label id="l${k}_${oi}"><input type="checkbox" id="b${k}_${oi}"> ${o}</label>`).join("")+`<button onclick="checkOne(${k},${qi})">Проверить</button> <span class="exp" id="e${k}"></span></div>`;
});
document.getElementById("box").innerHTML=h;
}
function checkOne(k,qi){
let q=Q[qi];let ok=true;
q.o.forEach((o,oi)=>{
let box=document.getElementById(`b${k}_${oi}`);let lab=document.getElementById(`l${k}_${oi}`);
lab.classList.remove("ok","bad","miss");
let need=q.c.includes(oi);
if(box.checked&&need)lab.classList.add("ok");
else if(box.checked&&!need){lab.classList.add("bad");ok=false}
else if(!box.checked&&need){lab.classList.add("miss");ok=false}
});
let e=document.getElementById(`e${k}`);e.style.display="block";e.textContent=(ok?"Верно! ":"Не всё. ")+q.e;
if(ok&&!checked.has(k)){checked.add(k);score++}
if(!ok&&checked.has(k)){checked.delete(k);score--}
document.getElementById("score").textContent=score;
document.getElementById("done").textContent=checked.size+"/"+order.length;
document.querySelector("#bar div").style.width=(checked.size/order.length*100)+"%";
save();
}
function checkAll(){order.forEach((qi,k)=>{if(!checked.has(k))checkOne(k,qi)});let f=document.getElementById("final");f.innerHTML=`<b>Итог: ${score}/${order.length}. 27+ отлично, 22+ хорошо, 18+ зачёт, меньше — жми «Только ошибки».</b>`}
function shuffle(){order=order.sort(()=>Math.random()-.5);checked.clear();score=0;document.getElementById("score").textContent=0;render()}
function retryWrong(){let wrong=order.filter((qi,k)=>!checked.has(k));if(!wrong.length){alert("Ошибок нет!");return}order=wrong;checked.clear();score=0;document.getElementById("score").textContent=0;render()}
function resetAll(){localStorage.removeItem("multitest");location.reload()}
function save(){let s=[];order.forEach((qi,k)=>{let v=[];Q[qi].o.forEach((o,oi)=>{if(document.getElementById(`b${k}_${oi}`)&&document.getElementById(`b${k}_${oi}`).checked)v.push(oi)});s.push(v)});localStorage.setItem("multitest",JSON.stringify(s))}
function load(){try{let s=JSON.parse(localStorage.getItem("multitest"));if(!s)return;s.forEach((v,k)=>{v.forEach(oi=>{let b=document.getElementById(`b${k}_${oi}`);if(b)b.checked=true})})}catch(e){}}
let sec=0;setInterval(()=>{sec++;document.getElementById("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")},1000);
render();
</script>
</body>
</html>
