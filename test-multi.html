<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест: выбери ВСЕ верные — ВСЁ по разделу</title>
<style>
body{font-family:Arial;max-width:900px;margin:0 auto;padding:12px;background:#f4f6f8;color:#222}
#top{position:sticky;top:0;background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:10}
#bar{height:10px;background:#ddd;border-radius:5px;overflow:hidden}#bar div{height:100%;width:0;background:#2e7d32}
.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.15)}
label{display:block;padding:6px;border:1px solid #bbb;border-radius:8px;margin:4px 0;cursor:pointer}
label.ok{background:#d7f0d8;border-color:#2e7d32}
label.bad{background:#ffd9d9;border-color:#c00}
label.miss{border:2px dashed #e6a800}
button{background:#2e7d32;color:#fff;border:0;border-radius:8px;padding:8px 14px;margin:4px 4px 4px 0;cursor:pointer}
button.ghost{background:#fff;color:#2e7d32;border:1px solid #2e7d32}
.exp{display:none;background:#e8f5e9;border-radius:8px;padding:8px;margin-top:6px}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<div id="top">
<b>Тест по ВСЕМУ разделу: выбери ВСЕ верные</b>
<div class="small">55 вопросов: метод, 7 приёмов, 10 свойств, хитрые карты, ГИС, Excel, визуализация, заливка/кружки, редакторы, подписи, способы. Зелёный — верно, красный — лишнее, пунктир — пропустил.</div>
<div id="bar"><div></div></div>
<div>Счёт: <span id="score">0</span> | Проверено: <span id="done">0/57</span> | <span id="timer">00:00</span>
<button class="ghost" onclick="shuffle()">Перемешать</button>
<button class="ghost" onclick="retryWrong()">Только ошибки</button>
<button class="ghost" onclick="resetAll()">Сброс</button></div>
</div>
<div id="box"></div>
<div class="card"><button onclick="checkAll()">Проверить всё сразу</button><div id="final"></div></div>
<script>
const Q=[
{q:"6 значений карты по Баранскому (3 верных)",o:["альфа и омега географии","второй язык географии","стимул заполнять белые пятна","карта сделана в Photoshop"],c:[0,1,2],e:"Ещё: закономерности, посредник человек–Земля, критерий географичности."},
{q:"Алаев одной фразой (1 верный + ловушки)",o:["Географично то, что картируется","Карта — это фото","ГИС — это игра"],c:[0],e:"5 слов. Баранский — длинно."},
{q:"Афоризмы: кто сказал? (3 верных — отмечай все)",o:["Карта — язык географии — Баранский","Без карты — Шокальский","Глобус — модель Земли — Бехайм"],c:[0,1,2],e:"Все три верны. Учи парами."},
{q:"Старые исследователи карт (3 верных)",o:["Дитмар","Салищев","Фрадкин","Тьюки"],c:[0,1,2],e:"Тьюки — визуализация, позже. Ещё Берлянт."},
{q:"Практики XIX — нач. XX (3 верных)",o:["Тилло","Семенов-Тян-Шанский","Анучин","Бертен"],c:[0,1,2],e:"Ещё Шокальский. Бертен — семиология."},
{q:"Вегенер и Кристаллер/Лёш (2 верных)",o:["дрейф материков","центральные места через картометрию","придумали Excel"],c:[0,1],e:"Классика применений."},
{q:"Где применяется метод (3 верных)",o:["физгео — ландшафты","эконом — факторы размещения и прогноз","страноведение — портрет территории","только для игр"],c:[0,1,2],e:"Плюс геоморфология, гидрология, планировка."},
{q:"Этапы (4 верных)",o:["подготовительный","аналитический","обобщающий","прогнозный"],c:[0,1,2,3],e:"Одна цепочка всегда."},
{q:"Приёмы: посмотреть и померить (2 верных)",o:["визуальный — глазами","картометрия — расстояния и площади","бранч — ветка"],c:[0,1],e:"Бранч — из менталок."},
{q:"Приёмы: построить и сравнить (2 верных)",o:["графический — профили","статистический — связи","менталка"],c:[0,1],e:"Профиль и связи."},
{q:"Приёмы: обработка (3 верных)",o:["смена проекций — лучше показать","математический — сгладить в ряды","авто — оцифровать","1 слово на ветвь"],c:[0,1,2],e:"1 слово — правило менталки."},
{q:"Путь экономгеографа (2 верных)",o:["от крупных полевых к мелким общим","от отраслевых к общеэкономическим","от цифры к фото"],c:[0,1],e:"Обобщение нарастает."},
{q:"Картометрия широко (2 верных)",o:["чтение + анализ + оценка","по топо И тематическим","только глазами"],c:[0,1],e:"Не только топо."},
{q:"Смысл и отбор (3 верных)",o:["абстрактность — смысл, не фото","избирательность — нужное","генерализация — главное, иначе каша"],c:[0,1,2],e:"Все три про упрощение с умом."},
{q:"Измерение и точность (3 верных)",o:["метричность — мерить (300 км)","однозначность — 1 знак = 1 смысл","соответствие — на своём месте"],c:[0,1,2],e:"Расчёт: 3 см × 1:10 000 000 = 300 км."},
{q:"Остальные свойства (3 верных)",o:["синтетичность — всё в одном","непрерывность — без дыр","обзорность — много сразу"],c:[0,1,2],e:"Ещё наглядность, подобие."},
{q:"4 из определения (4 верных)",o:["проекция — шар в плоскость","знаки — язык","отбор — генерализация","система — связи"],c:[0,1,2,3],e:"Ядро, спрашивают чаще всего."},
{q:"Только карта покажет (3 верных)",o:["дно океана и кору","магнитные аномалии","рождаемость и устойчивость","цвет крыши"],c:[0,1,2],e:"Крыши — и фото видит. Формула: снимок=факты, карта=факты+смысл."},
{q:"Качество по знакам (2 верных)",o:["породы леса","ширина и покрытие дорог","номер машины"],c:[0,1],e:"Проходимость болот — тоже сюда."},
{q:"Анаморфоза (3 верных)",o:["масштаб плавает от цифры","размер = населению","Тикунов, 2050"],c:[0,1,2],e:"Китай огромен, Россия мала."},
{q:"Картоид (3 верных)",o:["как схема метро","без проекции и масштаба","Киев-Новгород, Австралия"],c:[0,1,2],e:"Зачем: память, зависимости, типы."},
{q:"Менталка: автор и суть (2 верных)",o:["Бьюзен, >50 лет","центр-тема, ветки-бранчи","Тилло"],c:[0,1],e:"Тилло — XIX век, не он."},
{q:"Реки Африки веером (3 верных)",o:["Нил","Нигер","Конго","Волга"],c:[0,1,2],e:"Ещё Замбези, Лимпопо, Оранжевая."},
{q:"Правила менталки (3 верных)",o:["1 слово на ветвь","горизонтально","картинка в центре"],c:[0,1,2],e:"Ещё: длина=слову, цвета, мельче от центра, равномерно, мини-схема."},
{q:"Принципы менталки (2 верных)",o:["включает память","чёткость = осознанность","чем больше слов, тем лучше"],c:[0,1],e:"Больше слов — хуже."},
{q:"Информатика и теория (2 верных)",o:["собрать, хранить, найти, переделать","теория — часть кибернетики, меряет информацию","только игры"],c:[0,1],e:"База для геоинформатики."},
{q:"Носители и цепочка (3 верных)",o:["магнитные, лазерные, оптические","перфокарты → банки → ГИС","выдача: цифра, текст, графика, карты"],c:[0,1,2],e:"Сети и email — тоже."},
{q:"Определения (3 верных)",o:["геоинформатика — наука о методах","метод — создать и обновлять","ГИС — получить, хранить, выдать"],c:[0,1,2],e:"ГБД — таблица География в компе."},
{q:"Э-карты СНГ и мечта (2 верных)",o:["первая половина 90-х","одна модель Земли","70-е"],c:[0,1],e:"Унифицированные знаки и матоснова."},
{q:"Виды ГИС по цели (3 верных)",o:["кадастровые","картографические","управленческие"],c:[0,1,2],e:"Ещё научные, инженерные; отраслевые: вода, земля."},
{q:"Охват ГИС (3 верных)",o:["региональные","государственные","глобальные"],c:[0,1,2],e:"Ещё локальные. GRID — глобальный, ШГИС — учебная."},
{q:"GRID (2 верных)",o:["банк природы ООН (ЮНЕП)","для учёных","школьный тренажёр"],c:[0,1],e:"Не тренажёр."},
{q:"Эффект ГИС (3 верных)",o:["смена проекций и масштабов","оценки и прогнозы","объёмные и движущиеся сцены"],c:[0,1,2],e:"Как переход от руки к печати. 1996 — главная дорога."},
{q:"1996 и атласы (2 верных)",o:["конгресс — магистраль НТР","~30 атласов стран + ~10 мировых"],c:[0,1],e:"Испания, Дания, Вьетнам."},
{q:"Учебные проги (3 верных)",o:["мультимедиа-учебники","тренажёры и контроль","справочные + Office"],c:[0,1,2],e:"Ещё демонстрационные. Office: Word, Excel, PowerPoint, Publisher."},
{q:"Excel (3 верных)",o:["книга из листов","считает и рисует диаграммы","скучные цифры → графики"],c:[0,1,2],e:"Создание, правка, печать, БД."},
{q:"Базы из книги (3 верных поля)",o:["страна, столица","население, площадь","экономика / правление"],c:[0,1,2],e:"СНГ: экономика. Материк: + правление, устройство, режим. Таблица + вывод."},
{q:"Технологии цитаты (2 верных смысла)",o:["комп считает миллион в секунду — как магия","технологии — лишь инструмент","технологии не нужны"],c:[0,1],e:"Мирволд: идея из искры. Гейтс: мир не плоский."},
{q:"Визуализация определение (2 верных)",o:["показать чтобы мозгу легко","делает комп, легко повторить, мало декора"],c:[0,1],e:"Связана с инфографикой и анализом."},
{q:"К середине XIX (3 верных)",o:["столбики и круги","гистограммы","линии и временные ряды"],c:[0,1,2],e:"Ещё контурные. Начало XX — спад, учебники."},
{q:"Взрыв XX (3 верных)",o:["Тьюки — копаться в данных","Бертен — язык графики","комп + плоттер + мышь"],c:[0,1,2],e:"3-я четверть XX."},
{q:"Две работы (2 верных)",o:["показать готовое (доклад)","найти новое (закономерность)"],c:[0,1],e:"Презентация vs исследование. Инфографика — сложно, но понятно."},
{q:"Картограмма (3 верных)",o:["заливка по цифре, интервалы","фоновая — относительное","точечная — точки с цифрой"],c:[0,1,2],e:"Опустынивание — фон. Уголь — точки."},
{q:"Шкала урожайности (3 верных)",o:["до 20","20-30","выше 30 ц/га"],c:[0,1,2],e:"Рис.29."},
{q:"Где что показать (2 верных)",o:["вода, лес — физ","добыча, скот, урожай — эконом"],c:[0,1],e:"Везде, где распределение."},
{q:"Картодиаграмма (3 верных)",o:["кружки = сумме (люди, ВВП, сток)","где завод — не узнать","легенда: все размеры + единица"],c:[0,1,2],e:"1 мм2 = объём. Фигуры: круг, квадрат, шар, куб."},
{q:"Виды картодиаграмм (3 верных)",o:["простое сравнение","перемещения","изолинии"],c:[0,1,2],e:"Изолинии в географии успешны."},
{q:"Изолинии (2 верных)",o:["isol = равный","линии равных значений"],c:[0,1],e:"Горизонтали, изотермы."},
{q:"Техника построения (3 верных)",o:["изучить цифры и размещение","не закрывать столицы и границы","без пустых территорий"],c:[0,1,2],e:"Оптимальный размер + легенда."},
{q:"Обычная vs тематическая (2 верных)",o:["обычная — где что (Google)","тематическая — одна тема + цифры"],c:[0,1],e:"Город vs население города."},
{q:"Чем показывать (3 верных)",o:["размер","цвет","форма"],c:[0,1,2],e:"Религию залить нельзя — не измерить. Рис.34 — осадки Австралии."},
{q:"Растр (3 верных)",o:["Photoshop платный","GIMP/Krita бесплатные","Paint.NET учебный"],c:[0,1,2],e:"Из точек, жрёт память."},
{q:"Вектор (3 верных)",o:["Inkscape бесплатный","Illustrator/Corel платные","из линий формулами"],c:[0,1,2],e:"Тянется. Примитивы: эллипс, квадрат, ромб, линия."},
{q:"Гибрид (2 верных)",o:["RasterDesk для AutoCAD","Spotlight"],c:[0,1],e:"Умеют и то и то частично."},
{q:"Подписи (3 верных)",o:["вода — голубым курсивом","площади — прописными по центру","6-7 бумага / 9-10 экран"],c:[0,1,2],e:"Ещё: 2 кегля разница, не вверх ногами, снизу-слева, 1+1 шрифт."},
{q:"Слова раздела (2 верных)",o:["хороплет","фича","вкус"],c:[0,1],e:"ИКТ — тоже термин."},
{q:"3 способа школьной карты (3 верных)",o:["руками в Paint на контур","конструктор с диска","ГИС/ШГИС с базой"],c:[0,1,2],e:"Не успел — вне урока проектом. Карта — главное пособие."},
];
let order=[...Q.keys()],checked=new Set(),score=0;
function render(){
let h="";
order.forEach((qi,k)=>{
let q=Q[qi];
h+=`<div class="card" id="c${k}"><b>${k+1}. ${q.q}</b>`+q.o.map((o,oi)=>`<label id="l${k}_${oi}"><input type="checkbox" id="b${k}_${oi}"> ${o}</label>`).join("")+`<button onclick="checkOne(${k},${qi})">Проверить</button> <span class="exp" id="e${k}"></span></div>`;
});
document.getElementById("box").innerHTML=h;
}
function checkOne(k,qi){
let q=Q[qi];let ok=true;
q.o.forEach((o,oi)=>{
let box=document.getElementById(`b${k}_${oi}`);let lab=document.getElementById(`l${k}_${oi}`);
lab.classList.remove("ok","bad","miss");
let need=q.c.includes(oi);
if(box.checked&&need)lab.classList.add("ok");
else if(box.checked&&!need){lab.classList.add("bad");ok=false}
else if(!box.checked&&need){lab.classList.add("miss");ok=false}
});
let e=document.getElementById(`e${k}`);e.style.display="block";e.textContent=(ok?"Верно! ":"Не всё. ")+q.e;
if(ok&&!checked.has(k)){checked.add(k);score++}
if(!ok&&checked.has(k)){checked.delete(k);score--}
document.getElementById("score").textContent=score;
document.getElementById("done").textContent=checked.size+"/"+order.length;
document.querySelector("#bar div").style.width=(checked.size/order.length*100)+"%";
save();
}
function checkAll(){order.forEach((qi,k)=>{if(!checked.has(k))checkOne(k,qi)});let f=document.getElementById("final");f.innerHTML=`<b>Итог: ${score}/${order.length}. 50+ отлично, 42+ хорошо, 34+ зачёт, меньше — жми «Только ошибки».</b>`}
function shuffle(){order=order.sort(()=>Math.random()-.5);checked.clear();score=0;document.getElementById("score").textContent=0;render()}
function retryWrong(){let wrong=order.filter((qi,k)=>!checked.has(k));if(!wrong.length){alert("Ошибок нет!");return}order=wrong;checked.clear();score=0;document.getElementById("score").textContent=0;render()}
function resetAll(){localStorage.removeItem("multitest55");location.reload()}
function save(){let s=[];order.forEach((qi,k)=>{let v=[];Q[qi].o.forEach((o,oi)=>{if(document.getElementById(`b${k}_${oi}`)&&document.getElementById(`b${k}_${oi}`).checked)v.push(oi)});s.push(v)});localStorage.setItem("multitest55",JSON.stringify(s))}
let sec=0;setInterval(()=>{sec++;document.getElementById("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")},1000);
render();
</script>
</body>
</html>
