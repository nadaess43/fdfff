{s:"23",q:"[ПОВТОР] У кого одна гигантская / сеть?",o:["у дрожжей — одна гигантская","в мышцах — сеть","у всех одинаковые"],c:[0,1],e:"Зависит от типа и фазы."},
{s:"23",q:"Строение мито (3 верных)",o:["две мембраны → два пространства","зоны слипания = отсеки","внутренняя длиннее → кристы"],c:[0,1,2],e:"Кристы = площадь. Рис. 67."},
{s:"23",q:"Наружная мембрана мито (2 верных)",o:["проницаемая, бедна ферментами","внутри как гиалоплазма + ферменты на АТФ"],c:[0,1],e:"Противоположность внутренней."},
{s:"23",q:"Внутренняя мембрана (3 верных)",o:["непроницаема (кардиолипин)","~75% белка","дыхательная цепь + АТФ-синтетаза"],c:[0,1,2],e:"Самая активная мембрана."},
{s:"23",q:"Матрикс (3 верных)",o:["mater — мать; сотни ферментов","аэробное дыхание","кольцевые мтДНК + гранулы Ca/Mg"],c:[0,1,2],e:"Деление после репликации мтДНК; гены свои + ядерные."},
{s:"23",q:"Главная функция митохондрий",o:["АТФ — энергия","фотосинтез","синтез белков клетки"],c:[0],e:"Электростанция."},
{s:"23",q:"Пластиды: история (3 верных)",o:["Левенгук 1676","изучают с конца XIX (фотосинтез)","ультраструктура — 2-я половина XX"],c:[0,1,2],e:"Только у фототрофных."},
{s:"23",q:"Виды пластид (3 верных)",o:["хлоро, хромо, лейко","этио, амино, липидо","мито"],c:[0,1,2],e:"Мито — не пластида! Взаимопревращаются."},
{s:"23",q:"Ряд развития (3 верных)",o:["все от пропластид меристемы","этиопласты на свету → хлоропласты","хромопласт — конечная форма"],c:[0,1,2],e:"Разрушение тилакоидов → хромопласт."},
{s:"23",q:"Хлоропласт внутри (4 верных)",o:["двойная мембрана","тилакоиды; стопки — граны","строма + крахмал","кольцевая ДНК + мелкие рибосомы"],c:[0,1,2,3],e:"Рис. 68-69. 1 (хламидомонада) — десятки (лист)."},
{s:"23",q:"Деление и функции хлоропластов (3 верных)",o:["каждые 6-20 ч, не с ядром","углеводы (+аминокислоты, жирные кислоты), АТФ","кислород-побочка"],c:[0,1,2],e:"Ламеллы стромы между гранами."},
{s:"23",q:"Хромопласты (2 верных)",o:["каротиноиды: жёлтые, оранжевые, красные","в пузырьках стромы"],c:[0,1],e:"Лейкопласты — бесцветные запасы."},
{s:"23",q:"[ПОВТОР] Сходство мито и хлоропластов",o:["автономия: свои ДНК/рибосомы","двойные мембраны","оба без мембран"],c:[0,1],e:"Вопрос книги про автономию."},
{s:"23",q:"Таблица пластид",o:["хлоропласт/хромопласт/лейкопласт: строение + функция"],c:[0],e:"Готовь 3 строки."},
{s:"23",q:"Ключевые §23 (выбери все из списка, 5 верных)",o:["кристы","матрикс","граны","тилакоиды","строма"],c:[0,1,2,3,4],e:"Плюс внешняя/внутренняя мембраны, рибосомы."},
{s:"23",q:"Митохондриальные рибосомы и тРНК",o:["свои, участвуют в геноме митохондрий","их нет"],c:[0],e:"Полуавтономность."},
/* ===== §24 ЯДРО (18) ===== */
{s:"24",q:"Оболочка ядра (3 верных)",o:["две мембраны","щель 15-40 нм","поры — обмен"],c:[0,1,2],e:"Наружная с рибосомами + связана с гранулярной ЭПС."},
{s:"24",q:"Ламина (2 верных)",o:["промежуточные филаменты под внутренней","держит форму, укладывает хроматин, организует поры"],c:[0,1],e:"Часть кариоскелета."},
{s:"24",q:"Кариоплазма (2 верных)",o:["белки + ферменты + нуклеотиды","лежат хроматин и ядрышки"],c:[0,1],e:"Ядерный сок / нуклеоплазма."},
{s:"24",q:"Ядрышко (3 верных)",o:["1-10+ по активности","только в неделящихся","строится на генах рРНК → субъединицы рибосом"],c:[0,1,2],e:"Организаторы с копиями генов."},
{s:"24",q:"Состав хроматина ДНП (3 верных)",o:["ДНК 30-45%","гистоны 30-50%","негистоновые 4-33%"],c:[0,1,2],e:"Дезоксирибонуклеопротеид. Виды: глыбки, гранулы, нити."},
{s:"24",q:"Гетеро vs эухроматин (2 верных)",o:["эу — активный, светлый, рыхлый","гетеро — неактивный, тёмный, плотный"],c:[0,1],e:"Хроматин — форма в интерфазе."},
{s:"24",q:"Части хромосомы (4 верных)",o:["2 хроматиды (1 ДНК — сантиметры!)","центромера (первичная перетяжка)","теломеры (концы, от слипания)","спутники (вторичные; у человека 5 пар, гены рРНК)"],c:[0,1,2,3],e:"Рис. 72."},
{s:"24",q:"Типы по центромере (3 верных)",o:["мета — равноплечие","субмета — неравноплечие","акро — резко неравноплечие"],c:[0,1,2],e:"Плюс тело (одноплечие) и спутничные."},
{s:"24",q:"Конденсация: ступени (3 верных)",o:["2 нм → 11 нм нуклеосома (×7)","30 нм (×70) → 300 нм (×700)","700 нм хроматида (×10⁴)"],c:[0,1,2],e:"Называть спирализацией НЕВЕРНО — конденсация."},
{s:"24",q:"Кариотип и идиограмма (2 верных)",o:["кариотип — набор метафазных хромосом вида","идиограмма — его картинка"],c:[0,1],e:"У вида одинаков. Рис. 73."},
{s:"24",q:"Аутосомы и половые (2 верных)",o:["аутосомы одинаковы у полов","половые различают (XX / XY)"],c:[0,1],e:"X субмета, Y акро."},
{s:"24",q:"Человек и примеры (4 верных)",o:["2n=46 (22 пары + половые)","n=23","дрозофила 8","шимпанзе 48"],c:[0,1,2,3],e:"Рак 196. Сома 2n, половые n."},
{s:"24",q:"[ПОВТОР] Сколько у человека?",o:["46 (22+1)","48","196"],c:[0],e:"22 аутосом + XX/XY."},
{s:"24",q:"Ядра: число (3 верных)",o:["обычно 1 (3-10 мкм)","2 — инфузории; много — опалины","теряют эритроциты и ситовидные"],c:[0,1,2],e:"Вторичная потеря."},
{s:"24",q:"Функции ядра (3 верных)",o:["хранение наследства","передача дочерним","регуляция через белки + сборка субъединиц"],c:[0,1,2],e:"Носитель признаков, центр управления."},
{s:"24",q:"Функции хромосом (2 верных)",o:["хранят материал","передают дочерним"],c:[0,1],e:"С обоснованием."},
{s:"24",q:"Таблица ядра (5 верных строк)",o:["оболочка","кариоплазма","хроматин","хромосомы","кариотип"],c:[0,1,2,3,4],e:"Строение + функция каждой."},
{s:"24",q:"Хромосомы 1-9 по центромере (вопрос книги)",o:["назвать все 9 типов с характеристикой"],c:[0],e:"Тренируйся на рисунке."},
/* ===== §25 ФУНКЦИИ (8) ===== */
{s:"25",q:"Всё связано (3 верных)",o:["наружная мембрана ↔ ядерная","соседние клетки — впячивания","ЭПС связывает все части"],c:[0,1,2],e:"Мелкие размеры → большая поверхность → ферменты."},
{s:"25",q:"Мито — оболочки (2 верных)",o:["две трёхслойные, как мембрана","жидкость внутри"],c:[0,1],e:"Каналы ЭПС с продуктами."},
{s:"25",q:"Углеводные цепи (3 верных)",o:["глюкоза, галактоза, фруктоза","межклеточные связи, иммунитет, стабильность","спираль из неполярных аминокислот"],c:[0,1,2],e:"Гидрофобное взаимодействие."},
{s:"25",q:"Транспорт: уни/сим/анти (3 верных)",o:["унипорт — сам","симпорт — вместе в одну","антипорт — в разные"],c:[0,1,2],e:"Каналы — липопротеины. Na-K насос."},
{s:"25",q:"8 вопросов стр. 115: какие темы (3 верных)",o:["клетка как биосистема; ткани","клеточная теория; все органоиды","вода; все виды транспорта"],c:[0,1,2],e:"Плюс мини-проект и органоиды 1-11."},
{s:"25",q:"Термины стр. 115 (выбери 4 верных из списка)",o:["эндоцитоз и экзоцитоз","ЭПР и Гольджи","пероксисома и центриоль","фотосинтез и дыхание (это процессы)"],c:[0,1,2],e:"Процессы — не термины структур. Весь список учи."},
{s:"25",q:"Почему клетка — система (Ленинджер)",o:["все части связаны и работают как целое"],c:[0],e:"Своими словами + пример."},
{s:"25",q:"Ключевые §25 (5 верных)",o:["цитоплазма","гиалоплазма и органоиды","ядро","вода","транспорт"],c:[0,1,2,3,4],e:"Плюс органические соединения."},
/* ===== §26 МЕМБРАНА СВЯЗЬ (10) ===== */
{s:"26",q:"Би = двойной (2 верных)",o:["гидрофил (глицерин) наружу","гидрофоб (жирные кислоты) внутрь"],c:[0,1],e:"Белки с обеих сторон, сквозные."},
{s:"26",q:"Кто проходит сам (2 верных)",o:["мелкие нейтральные (кислород, азот)","ионы — только через белки/поры"],c:[0,1],e:"Снаружи солёнее → осмос выравнивает."},
{s:"26",q:"Гликокаликс (2 верных)",o:["слой животных клеток: полисахариды + белки","тонкий, эластичный, не виден в световой"],c:[0,1],e:"У растений вместо него стенка."},
{s:"26",q:"Модель: кто и когда",o:["Сингер и Николсон, 1972","жидкостно-мозаичная (кристаллическая)"],c:[0,1],e:"Белки плавают в жидком бислое."},
{s:"26",q:"Мозаика как что (2 верных)",o:["плёнка мыльного пузыря — переливается","белки меняют положение"],c:[0,1],e:"Толщина ~7,5 нм. Головы наружу, хвосты внутрь."},
{s:"26",q:"Ненасыщенные кислоты и холестерол (3 верных)",o:["изломы → рыхло → жиже","холестерол разрыхляет: гибче + прочнее","важно в холоде (не твердеют)"],c:[0,1,2],e:"Без него рвутся. Стороны разные."},
{s:"26",q:"Белки в бислое (2 верных)",o:["гидрофобные участки (вода вытолкнута)","гидрофильные наружу к воде"],c:[0,1],e:"Частично погружены или насквозь."},
{s:"26",q:"Антенны (2 верных)",o:["олигосахаридные цепи","гликопротеины и гликолипиды"],c:[0,1],e:"Роль антенн."},
{s:"26",q:"8 вопросов стр. 118: темы (3 верных)",o:["обзор + кто/когда модель","состояние белков и липидов; каркас","головы/хвосты; белки; олигоцепи; холестерол"],c:[0,1,2],e:"Плюс наружная/внутренняя + информация."},
{s:"26",q:"Ключевые §26 (2 верных)",o:["Сингер и Николсон","жидкостно-кристаллическая модель"],c:[0,1],e:"Рис. 75."},
/* ===== §27 МОЛЕКУЛЫ (10) ===== */
{s:"27",q:"Головки ганглиозидов (3 верных)",o:["на наружной поверхности","много в мозге, эритроцитах, эпителии","антигены (разные у людей)"],c:[0,1,2],e:"Олигосахаридные цепи."},
{s:"27",q:"Холестерол: где и сколько (3 верных)",o:["только у ЖИВОТНЫХ","0,3-0,4 (в плазматической 0,8-0,9)","тормозит подвижность → влияет на белки"],c:[0,1,2],e:"Жёсткое ядро + гибкий хвост."},
{s:"27",q:"[ПОВТОР] У растений вместо холестерола",o:["ситостерол и стигмастерол"],c:[0],e:"Растительные стероиды."},
{s:"27",q:"Белки: интегральные vs периферические (3 верных)",o:["интегральные — гидрофобные, сквозные; снять только детергентами","периферические — электростатика; смываются солями","все одинаковые"],c:[0,1],e:"Додецилсульфат, желчные соли."},
{s:"27",q:"Механизмы переноса (5 верных)",o:["простая диффузия","пассивный симпорт/антипорт","первично-активный","вторично-активный","регулируемые каналы"],c:[0,1,2,3,4],e:"Плюс макрочастицы и межклеточные."},
{s:"27",q:"Диффузия (2 верных)",o:["по градиенту (откуда больше)","через поры или липидную фазу (жирорастворимые)"],c:[0,1],e:"Вода, ионы — через поры."},
{s:"27",q:"Рисунок: что под цифрами 1-7",o:["1 олигосахариды, 2 бислой, 3 канал, 4 хвосты, 5 головы, 6 белки, 7 гликопротеины"],c:[0],e:"Выучи подписи."},
{s:"27",q:"Таблица §27 (5 верных строк)",o:["белки","фосфолипиды","гликопротеины","гликолипиды","холестерол"],c:[0,1,2,3,4],e:"Функция каждой."},
{s:"27",q:"7 вопросов стр. 122: темы (3 верных)",o:["свойства мембран; 2 группы фосфолипидов","глицеро/сфинго/гликолипиды; холестерол","группы белков; механизмы переноса"],c:[0,1,2],e:"Плюс рисунок и мембраны = целостность."},
{s:"27",q:"[ПОВТОР] Мембраны = целостность",o:["важный фактор целостности клетки","не важны"],c:[0],e:"Своими словами."},
/* ===== §28 ФАКТОРЫ + ЛАБ (8) ===== */
{s:"28",q:"Состав мембраны §28 (2 верных)",o:["фосфолипиды, лецитин","немного холестерола и гликолипидов"],c:[0,1],e:"Связана с цитоскелетом → устойчивость."},
{s:"28",q:"7 механизмов повреждения (выбери 4 верных)",o:["разрыв при травме","протеолиз (трипсин, комплемент)","нет АТФ → насосы стоят + ПОЛ","коагуляция белков (кислоты, ток, жара)"],c:[0,1,2,3],e:"Остальные 3 — в следующем."},
{s:"28",q:"Ещё 3 механизма (3 верных)",o:["передоз наперстянки → АТФаза → калий/натрий/кальций","акантоцитоз: нет бета-липопротеина → звёздчатые эритроциты","свободные радикалы, ПОЛ"],c:[0,1,2],e:"Наперстянка лечит сердце! Нервы+сетчатка → гибель."},
{s:"28",q:"Лаб №4: гипотеза (2 верных)",o:["свёкла: антоциан в вакуолях","лёд — держит, кипяток — выпускает"],c:[0,1],e:"4 кусочка: лёд/комнатная/горячая/кипяток."},
{s:"28",q:"Лаб №4: вывод и метод (2 верных)",o:["температура бьёт мембрану","метод надёжен; впредь измерить температуру"],c:[0,1],e:"Строго по плану, но не строго научен."},
{s:"28",q:"Плазмолиз/деплазмолиз (2 верных)",o:["по скорости судят о проницаемости","для тех или иных веществ"],c:[0,1],e:"Часть 2 работы."},
{s:"28",q:"[ПОВТОР] ПОЛ — это",o:["перекисное окисление липидов","полезный процесс"],c:[0],e:"Отдельно подробно в книге."},
{s:"28",q:"[ПОВТОР] Наперстянка и мембрана",o:["передоз бьёт АТФазу и ионы","лечит без побочек"],c:[0],e:"Калий, натрий, кальций."},
/* ===== §29 БАКТЕРИИ/ГРИБЫ (16) ===== */
{s:"29",q:"Оболочка грибов (3 верных)",o:["сахара, белки, жиры + хитин","хитин до 60% сухого веса","хитозан у Zygomycota"],c:[0,1,2],e:"Хитин как скелет насекомых; не растворяется в щёлочи."},
{s:"29",q:"Ещё про оболочку грибов (3 верных)",o:["целлюлозно-хитиновая или хитиново-глюкановая","старея — кутинизация, оксалат кальция","снаружи ослизняется"],c:[0,1,2],e:"Гетерополимеры: манноза, глюкоза, галактоза."},
{s:"29",q:"Протопласт грибов (2 верных)",o:["отделён плазмалеммой","вход/выход: пассив + АТФ"],c:[0,1],e:"Внутри: ядро, мито с уплощёнными кристами, слабый ЭПР."},
{s:"29",q:"Диктиосом нет — а что есть?",o:["скопления ЭПР","ничего"],c:[0],e:"Вместо телец Гольджи."},
{s:"29",q:"Ломасомы",o:["губчатые тельца под мембраной, функции неясны"],c:[0],e:"Особенность грибов."},
{s:"29",q:"Ядро грибов (3 верных)",o:["маленькое, двойная мембрана","дикарионы (n+n) после слияния","ядра ползают между клетками"],c:[0,1,2],e:"Репликация → в цитоплазму через РНК."},
{s:"29",q:"Митоз грибов (3 верных)",o:["закрытый (оболочка цела)","центриолей нет","перегородка не сразу → многоядерные"],c:[0,1,2],e:"Отличие от наших."},
{s:"29",q:"Жгутики грибов (2 верных)",o:["только у хитридиомицетов","2 одиночные + 9 двойных (не как у бактерий)"],c:[0,1],e:"Для зооспор и гамет."},
{s:"29",q:"Бактерии: 7 отличий (выбери 4 верных)",o:["прокариоты, нет ядра","муреин в стенке","нет Гольджи и ЭПС","мезосомы вместо митохондрий"],c:[0,1,2,3],e:"Остальные: много рибосом, жгутики, 0,3-10 мкм."},
{s:"29",q:"Ещё отличия бактерий (3 верных)",o:["много рибосом","жгутики — движение","размер 0,3-0,5 — 5-10 мкм"],c:[0,1,2],e:"Все 7 учи списком."},

let order=[...Q.keys()],checked=new Set(),score=0,errs={};
const secs=[["18","§18 Обзор"],["19","§19 Стенка"],["20","§20 Мембрана"],["21","§21 Цитоплазма"],["22","§22 Одномембранные"],["23","§23 Двумембранные"],["24","§24 Ядро"],["25","§25 Функции"],["26","§26 Связь"],["27","§27 Молекулы"],["28","§28 Факторы"],["29","§29 Бактерии/грибы"],["30","§30 Раст./животн."],["R","Финал"]];
function render(){
let nav=secs.map(s=>`<a href="#sec${s[0]}">${s[1]}</a>`).join("");
document.getElementById("nav").innerHTML=nav;
let h="",last="";
order.forEach((qi,k)=>{
let q=Q[qi];
if(q.s!==last){let t=(secs.find(x=>x[0]===q.s)||["",q.t||"Финал"])[1];h+=`<div class="sec" id="sec${q.s}">${t}</div>`;last=q.s}
let rep=q.q.includes("[ПОВТОР]")?`<span class="rep">ПОВТОР</span> `:"";
h+=`<div class="card"><b>${k+1}. ${rep}${q.q}</b>`+q.o.map((o,oi)=>`<label id="l${k}_${oi}"><input type="checkbox" id="b${k}_${oi}"> ${o}</label>`).join("")+`<button onclick="checkOne(${k},${qi})">Проверить</button> <span class="exp" id="e${k}"></span></div>`;
});
document.getElementById("box").innerHTML=h;
}
function checkOne(k,qi){
let q=Q[qi];let ok=true;
q.o.forEach((o,oi)=>{
let box=document.getElementById(`b${k}_${oi}`);let lab=document.getElementById(`l${k}_${oi}`);
lab.classList.remove("ok","bad","miss");
let need=q.c.includes(oi);
if(box.checked&&need)lab.classList.add("ok");
else if(box.checked&&!need){lab.classList.add("bad");ok=false}
else if(!box.checked&&need){lab.classList.add("miss");ok=false}
});
let e=document.getElementById(`e${k}`);e.style.display="block";e.textContent=(ok?"Верно! ":"Не всё — читай разбор. ")+q.e;
if(ok&&!checked.has(k)){checked.add(k);score++;delete errs[k]}
if(!ok){checked.delete(k);errs[k]=1;if(score>0&&document.getElementById(`l${k}_0`).classList.contains("bad")){} }
if(!ok&&!checked.has(k)){/* err count below */}
document.getElementById("score").textContent=score;
document.getElementById("done").textContent=checked.size+"/"+order.length;
document.getElementById("err").textContent=Object.keys(errs).length;
document.querySelector("#bar div").style.width=(checked.size/order.length*100)+"%";
save();
}
function checkAll(){order.forEach((qi,k)=>{if(!checked.has(k))checkOne(k,qi)});document.getElementById("final").innerHTML=`<b>Итог: ${score}/${order.length}. 150+ отлично, 130+ хорошо, 110+ зачёт, меньше — Только ошибки.</b>`}
function shuffle(){order=order.sort(()=>Math.random()-.5);checked.clear();score=0;errs={};document.getElementById("score").textContent=0;document.getElementById("err").textContent=0;render()}
function retryWrong(){let wrong=order.filter((qi,k)=>!checked.has(k));if(!wrong.length){alert("Ошибок нет!");return}order=wrong;checked.clear();score=0;errs={};document.getElementById("score").textContent=0;render()}
function exam(){let pool=[...Q.keys()].sort(()=>Math.random()-.5).slice(0,30);order=pool;checked.clear();score=0;errs={};document.getElementById("score").textContent=0;render();location.hash="#box"}
function resetAll(){localStorage.removeItem("bio150");location.reload()}
function showMist(){let h="<b>Ошибки:</b><br>";Object.keys(errs).forEach(k=>{let qi=order[k];h+=`${(+k)+1}. ${Q[qi].q}<br>`});document.getElementById("mist").innerHTML=h}
function save(){try{localStorage.setItem("bio150",JSON.stringify({score,done:[...checked]}))}catch(e){}}
let sec0=0;setInterval(()=>{sec0++;document.getElementById("timer").textContent=String(Math.floor(sec0/60)).padStart(2,"0")+":"+String(sec0%60).padStart(2,"0")},1000);
render();
</script>
