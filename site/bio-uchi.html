<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Биология §§19-21: читай и выбирай все верные</title>
<style>
body{font-family:Arial;max-width:950px;margin:0 auto;padding:12px;background:#f4f6f8;color:#222}
#top{position:sticky;top:0;background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:10}
#bar{height:10px;background:#ddd;border-radius:5px;overflow:hidden}#bar div{height:100%;width:0;background:#1b7f5a}
.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.read{border-left:4px solid #1b7f5a;padding-left:10px}
.key{background:#e8f5e9;border-radius:8px;padding:8px;margin:8px 0}
label{display:block;padding:6px;border:1px solid #bbb;border-radius:8px;margin:4px 0;cursor:pointer}
label.ok{background:#d7f0d8;border-color:#1b7f5a}
label.bad{background:#ffd9d9;border-color:#c00}
label.miss{border:2px dashed #e6a800}
button{background:#1b7f5a;color:#fff;border:0;border-radius:8px;padding:8px 14px;margin:4px 4px 4px 0;cursor:pointer}
button.ghost{background:#fff;color:#1b7f5a;border:1px solid #1b7f5a}
.exp{display:none;background:#e8f5e9;border-radius:8px;padding:8px;margin-top:6px}
textarea{width:100%;min-height:60px;border-radius:8px;border:1px solid #aaa;padding:8px;box-sizing:border-box}
.small{font-size:13px;color:#555}
nav a{display:inline-block;padding:6px 10px;background:#fff;border-radius:8px;margin:2px;text-decoration:none;color:#222;font-size:14px}
</style>
</head>
<body>
<div id="top">
<b>Биология 10 кл, §§19-21 (стр. 83-95): стенка → мембрана → цитоплазма</b>
<div class="small">Читай кусок → отмечай ВСЕ верные → «Проверить». Зелёный — верно, красный — лишнее, пунктир — пропустил. Прогресс сохраняется.</div>
<div id="bar"><div></div></div>
<div>Счёт: <span id="score">0</span> | Проверено: <span id="done">0/23</span> | <span id="timer">00:00</span>
<button class="ghost" onclick="shuffle()">Перемешать</button>
<button class="ghost" onclick="retryWrong()">Только ошибки</button>
<button class="ghost" onclick="resetAll()">Сброс</button></div>
<nav><a href="#p19">§19 Стенка</a><a href="#p20">§20 Мембрана</a><a href="#p21">§21 Цитоплазма</a><a href="#fin">Финал</a></nav>
</div>
<div id="box"></div>
<div class="card" id="fin"><button onclick="checkAll()">Проверить всё сразу</button><div id="final"></div>
<h3>Повторы</h3><label><input type="checkbox" id="r1"> Завтра — всё заново</label><br><label><input type="checkbox" id="r3"> Через 3 дня — только ошибки</label></div>
<script>
const Q=[
{s:"p19",t:"§19. Клеточная стенка — у кого из чего",read:"Стенка — жёсткая оболочка НАД мембраной. Есть у бактерий, грибов, растений. У животных НЕТ. Бактерии — муреин (грам+/- → антибиотики). Грибы — хитин+глюканы. Водоросли — полисахариды, диатомеи — кремнезём. Растения: каркас целлюлоза (микрофибриллы), матрикс ~60% (гемицеллюлоза+пектин), вставки лигнин/кутин/суберин/воск. Слои: пластинка, первичная, плазмалемма. Мостики — плазмодесмы. Функции: защита, опора, транспорт, буфер, стойкость, ионообмен.",key:"Бактерии-муреин, грибы-хитин, растения-целлюлоза, диатомеи-кремнезём. У животных стенки нет.",q:"У кого есть клеточная стенка? (3 верных)",o:["бактерии","грибы","растения","животные"],c:[0,1,2],e:"У животных стенки нет — главная ловушка."},
{s:"p19",t:"§19. Клеточная стенка — у кого из чего",read:"",key:"",q:"Вещество стенки (3 верных пары)",o:["бактерии — муреин","грибы — хитин и глюканы","диатомеи — кремнезём","растения — муреин"],c:[0,1,2],e:"Растения — целлюлоза, не муреин."},
{s:"p19",t:"§19. Клеточная стенка — у кого из чего",read:"",key:"",q:"Растительная стенка: что куда (3 верных)",o:["каркас — целлюлоза, микрофибриллы","матрикс ~60% — гемицеллюлоза и пектин","вставки — лигнин, кутин, суберин, воск","каркас — пектин"],c:[0,1,2],e:"Пектин — матрикс, не каркас. Пектин связывается с кальцием и магнием."},
{s:"p19",t:"§19. Клеточная стенка — у кого из чего",read:"",key:"",q:"Зачем стенка + детали (3 верных)",o:["не рвётся в гипотонической среде","ионообменник (ионы туда-сюда)","грам+/- делят по стенке → чувствительность к антибиотикам","есть у животных"],c:[0,1,2],e:"Плюс защита, опора, транспорт, буфер. Плазмодесмы — мостики между клетками."},
{s:"p19",t:"§19. Клеточная стенка — у кого из чего",read:"",key:"",q:"Рис. 50-51: что где (2 верных)",o:["Рис. 50 — бактерия: капсула, нуклеоид, пили, жгутик","Рис. 51 — гриб: стенка, ядро с порами","Рис. 50 — гриб с хлоропластами"],c:[0,1],e:"Хлоропластов у грибов нет."},
{s:"p20",t:"§20. Мембрана — состав",read:"Три класса липидов: 1) фосфолипиды — бислой (хвосты внутрь, головы наружу), глицеро- (фосфатидилхолин, фосфатидилэтаноламин) и сфинго- (сфингомиелин — миелин нервов); кардиолипин — внутренняя мембрана митохондрий ~22%. 2) гликолипиды — церамид + углевод. 3) холестерол — жёсткость между хвостами. Белки «растворены»: поверхностные, интегральные, гликопротеины. В соли — электроизоляторы.",key:"Бислой: хвосты внутрь, головы наружу. Холестерол — жёсткость. Кардиолипин — митохондрии. Сфингомиелин — нервы.",q:"Три класса липидов (3 верных)",o:["фосфолипиды — бислой","гликолипиды — церамид + углевод","холестерол — жёсткость","целлюлоза"],c:[0,1,2],e:"Целлюлоза — стенка, не мембрана."},
{s:"p20",t:"§20. Мембрана — состав",read:"",key:"",q:"Детали липидов (3 верных)",o:["частые — фосфатидилхолины и этаноламины","кардиолипин — митохондрии ~22%","сфингомиелин — миелин нервов","холестерол снаружи головы"],c:[0,1,2],e:"Холестерол — между хвостами внутри."},
{s:"p20",t:"§20. Мембрана — состав",read:"",key:"",q:"Бислой: что куда (2 верных)",o:["гидрофобные хвосты внутрь","гидрофильные головы наружу к воде"],c:[0,1],e:"Поэтому гидрофильное само не проходит — нужны каналы."},
{s:"p20",t:"§20. Мембрана — 9 функций",read:"Барьер (пероксисомы держат пероксиды), избирательность (по размеру/заряду), транспорт (еда/мусор/градиенты/pH), матричная (расставить белки), механическая (автономность; у растений стенки, у животных межклеточное вещество), энергетическая (хлоропласты/дыхание), рецепторная (сигналы), ферментативная, маркировка + коммуникация (обмен со средой). Пассив — без энергии по градиенту (диффузия; облегчённая с помощником). Актив — с АТФ против: АТФаза К+ внутрь, Na+ наружу.",key:"Пассив — без, по. Актив — с АТФ, против. АТФаза: калий внутрь, натрий наружу.",q:"Пассив vs актив (3 верных)",o:["пассив — без энергии, по градиенту","облегчённая — с молекулой-помощником","актив — с АТФ, против градиента"],c:[0,1,2],e:"Пример актив: АТФаза."},
{s:"p20",t:"§20. Мембрана — 9 функций",read:"",key:"",q:"Насосы и каналы (2 верных)",o:["АТФаза: К+ внутрь, Na+ наружу","большие/гидрофильные — через транспортеры и каналы или эндоцитоз"],c:[0,1],e:"Внутри гидрофобно — гидрофильное само не лезет."},
{s:"p20",t:"§20. Мембрана — 9 функций",read:"",key:"",q:"Функции с примерами (3 верных)",o:["барьер — пероксисомы держат пероксиды","механическая — у животных межклеточное вещество","рецепторная — белки ловят сигналы"],c:[0,1,2],e:"Энергетическая — хлоропласты и митохондрии."},
{s:"p21",t:"§21. Цитоплазма — студень",read:"Цитоплазма: между мембраной и ядром. Три части: гиалоплазма + включения + органоиды. Гиалоплазма («прозрачный»): без включений, коллоид — вода + мицеллы (белки, жиры, углеводы), одинаковый заряд → отталкиваются → броуновское движение. Зачем: дороги для еды и сигналов (цитокины), реакции — гликолиз: глюкоза → 2 пирувата + АТФ (без кислорода).",key:"Коллоид: вода + мицеллы. Броуновское. Гликолиз — 2 пирувата + АТФ.",q:"Гиалоплазма (3 верных)",o:["коллоид: вода + мицеллы","заряд одинаковый → броуновское","гликолиз: 2 пирувата + АТФ"],c:[0,1,2],e:"Гликолиз — анаэробный, в гиалоплазме."},
{s:"p21",t:"§21. Скелет клетки",read:"Три нити: 1) микротрубочки — 25 нм, тубулин, плюс растёт/минус разбирается, моторы кинезин (к плюсу, от центра) и динеин (обратно), шаг 1 АТФ, >1 см/ч, везут пузырьки и органоиды. 2) микрофиламенты — 4-6 нм, актин. 3) промежуточные — 8-19 нм, жёсткие, где нагрузка (эпителий, мышцы). Центр (центросома): собирает трубочки, у животных есть, у высших растений НЕТ; поломка → болезни цикла. Диплосома — 2 центриоли под прямым углом; центриоль 500×150 нм, 9 триплетов.",key:"25 тубулин, 4-6 актин, 8-19 средние. Кинезин к краю, динеин обратно. Центра нет у высших растений.",q:"Три нити — размеры (3 верных)",o:["трубочки 25 нм — тубулин","филаменты 4-6 нм — актин","промежуточные 8-19 нм"],c:[0,1,2],e:"Главная таблица размеров."},
{s:"p21",t:"§21. Скелет клетки",read:"",key:"",q:"Кинезин vs динеин (3 верных)",o:["кинезин — к плюс-концу, от центра","динеин — обратно к центру","шаг — 1 АТФ, скорость >1 см/ч"],c:[0,1,2],e:"Везут пузырьки, вакуоли, митохондрии."},
{s:"p21",t:"§21. Скелет клетки",read:"",key:"",q:"Клеточный центр (3 верных)",o:["собирает микротрубочки","есть у животных, нет у высших растений","поломка → аномалии цикла и болезни"],c:[0,1,2],e:"Диплосома — две центриоли под прямым углом."},
{s:"p21",t:"§21. Скелет клетки",read:"",key:"",q:"Центриоль (2 верных)",o:["~500×150 нм","стенка — 9 триплетов"],c:[0,1],e:"Материнская + дочерняя, ручки."},
{s:"p21",t:"§21. Рибосомы — завод белков",read:"Две субъединицы, щель — идёт иРНК, бороздка — ползёт цепь. Участки Р и А для тРНК с аминокислотами. Сборка белков. Десятки миллионов: поодиночке или группы (полисомы — несколько на одной иРНК). Свободные или на ЭПС/ядре. Есть у прокариот, в мито и пластидах. Размер эукариот ~30 нм, у прокариот мельче.",key:"Сборка белков. Полисомы. 30 нм, у прокариот мельче.",q:"Рибосомы (3 верных)",o:["собирают белки из аминокислот","полисомы — несколько на одной иРНК","у прокариот мельче, чем ~30 нм"],c:[0,1,2],e:"Р и А — участки для тРНК. Свободные или на ЭПС."},
{s:"p21",t:"§21. Рибосомы — завод белков",read:"",key:"",q:"Где рибосомы бывают (3 верных)",o:["свободно в гиалоплазме","на ЭПС и ядерной мембране","в митохондриях и пластидах"],c:[0,1,2],e:"И у прокариот тоже есть."},
{s:"mix",t:"Связка всех трёх",read:"Цепочка: стенка держит → мембрана впускает (калий внутрь, натрий наружу) → цитоплазма везёт (кинезин от центра) и строит (рибосомы).",key:"Стена, плёнка, внутренность.",q:"Ловушки БЖБ (3 верных)",o:["стенки нет у животных","центросом нет у высших растений","кинезин — к краю, динеин — к центру"],c:[0,1,2],e:"Кардиолипин — мито, сфингомиелин — нервы, диатомеи — кремнезём."},
{s:"mix",t:"Связка всех трёх",read:"",key:"",q:"Цифры (3 верных)",o:["матрикс ~60%","кардиолипин ~22%","рибосомы ~30 нм, трубочки 25 нм"],c:[0,1,2],e:"Центриоль 500×150 нм. Шаг кинезина 1 АТФ."},
{s:"mix",t:"Связка всех трёх",read:"",key:"",q:"Рисунки книги (2 верных)",o:["50 — бактерия, 51 — гриб, 52-53 — стенка","56-60 — трубочки, моторы, центр, рибосома"],c:[0,1],e:"76 — белки и липиды мембраны."},
{s:"mix",t:"Связка всех трёх",read:"",key:"",q:"Таблицы для БЖБ (3 верных надо заполнить)",o:["стенки: сходство/различия","мембраны: 9 функций","немембранные: строение/функция"],c:[0,1,2],e:"Плюс сопоставление 11 органоидов стр. 82 и пластиды."},
{s:"mix",t:"Связка всех трёх",read:"",key:"",q:"Блёрт: что помнишь без подглядывания? Отметь что сделал",o:["пересказал §19 своими словами","пересказал §20 (насосы!)","пересказал §21 (нити + рибосомы)"],c:[0,1,2],e:"Не отметил — значит вернись и перескажи вслух. Так и запоминается."},
];
let order=[...Q.keys()],checked=new Set(),score=0;
function sec(id){return document.querySelector(`[href='#${id}']`)}
function render(){
let h="",last="";
order.forEach((qi,k)=>{
let q=Q[qi];
if(q.s!==last&&(q.s==="p19"||q.s==="p20"||q.s==="p21")){h+=`<div class="card" id="${q.s}"><h2>${q.t.split(".")[0]}. ${q.s==="p19"?"§19 Стенка":q.s==="p20"?"§20 Мембрана":"§21 Цитоплазма"}</h2><div class="read">${q.read||""}</div>${q.key?`<div class="key"><b>Ключевое:</b> ${q.key}</div>`:""}<div class="small">Прочитай, потом отмечай ниже. Блёрт: <textarea placeholder="Напиши по памяти..."></textarea></div></div>`;last=q.s}
h+=`<div class="card"><b>${k+1}. ${q.q}</b> <span class="small">[${q.s==="mix"?"связка":q.s}]</span>`+q.o.map((o,oi)=>`<label id="l${k}_${oi}"><input type="checkbox" id="b${k}_${oi}"> ${o}</label>`).join("")+`<button onclick="checkOne(${k},${qi})">Проверить</button> <span class="exp" id="e${k}"></span></div>`;
});
document.getElementById("box").innerHTML=h;
}
function checkOne(k,qi){
let q=Q[qi];let ok=true;
q.o.forEach((o,oi)=>{
let box=document.getElementById(`b${k}_${oi}`);let lab=document.getElementById(`l${k}_${oi}`);
lab.classList.remove("ok","bad","miss");
let need=q.c.includes(oi);
if(box.checked&&need)lab.classList.add("ok");
else if(box.checked&&!need){lab.classList.add("bad");ok=false}
else if(!box.checked&&need){lab.classList.add("miss");ok=false}
});
let e=document.getElementById(`e${k}`);e.style.display="block";e.textContent=(ok?"Верно! ":"Не всё. ")+q.e;
if(ok&&!checked.has(k)){checked.add(k);score++}
if(!ok&&checked.has(k)){checked.delete(k);score--}
document.getElementById("score").textContent=score;
document.getElementById("done").textContent=checked.size+"/"+order.length;
document.querySelector("#bar div").style.width=(checked.size/order.length*100)+"%";
save();
}
function checkAll(){order.forEach((qi,k)=>{if(!checked.has(k))checkOne(k,qi)});document.getElementById("final").innerHTML=`<b>Итог: ${score}/${order.length}. 20+ отлично, 16+ хорошо, 12+ зачёт.</b>`}
function shuffle(){order=order.sort(()=>Math.random()-.5);checked.clear();score=0;document.getElementById("score").textContent=0;render()}
function retryWrong(){let wrong=order.filter((qi,k)=>!checked.has(k));if(!wrong.length){alert("Ошибок нет!");return}order=wrong;checked.clear();score=0;document.getElementById("score").textContent=0;render()}
function resetAll(){localStorage.removeItem("bio1921");location.reload()}
function save(){let s=[];order.forEach((qi,k)=>{let v=[];Q[qi].o.forEach((o,oi)=>{let b=document.getElementById(`b${k}_${oi}`);if(b&&b.checked)v.push(oi)});s.push(v)});localStorage.setItem("bio1921",JSON.stringify(s))}
let sec0=0;setInterval(()=>{sec0++;document.getElementById("timer").textContent=String(Math.floor(sec0/60)).padStart(2,"0")+":"+String(sec0%60).padStart(2,"0")},1000);
render();
</script>
</body>
</html>
